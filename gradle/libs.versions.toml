[versions]
androidGradlePlugin = "9.0.1"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.03.01"
# m3-expressive A.1 — pin material3 to 1.5.0-alpha18, the alpha that
# promotes `MaterialExpressiveTheme` / `expressiveLightColorScheme` /
# `expressiveDarkColorScheme` to public API. The 1.4.0 stable line
# (resolved by the BOM above) keeps these `internal`, so we override.
# Drop this override once 1.5.0 stable ships and the BOM picks it up.
composeMaterial3 = "1.5.0-alpha18"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
coroutines = "1.10.2"
junit = "4.13.2"
kotlin = "2.3.20"
media3 = "1.10.0"
nav3Core = "1.0.1"
lifecycleViewmodelNav3 = "2.10.0"
room = "2.8.4"
ksp = "2.3.7"
robolectric = "4.14.1"
androidxArchCoreTest = "2.2.0"
androidxDataStore = "1.1.2"
kotlinxCoroutinesGuava = "1.10.2"
kotlinxSerializationJson = "1.7.3"
coil3 = "3.1.0"
work = "2.10.0"
coreSplashscreen = "1.0.1"
androidxPalette = "1.0.0"
licensee = "1.13.0"
# Cover-art Phase B — Piped HTTP client tests. MockWebServer drives the
# instance-failover unit test without going to real network. Pinned to
# the okhttp version Coil brings in transitively (4.x line). Test-scope
# only — does not ship in the APK.
okhttp = "4.12.0"
# Cover-art Phase D.1 — drag-to-reorder for the provider priority list.
# Apache-2.0; allowed by the licensee allowlist.
reorderable = "2.4.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended"}
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui"}
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"}
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest"}
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "androidxArchCoreTest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDataStore" }
kotlinx-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "kotlinxCoroutinesGuava" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
# Coil 3 — Compose-first image loading. Used by D.9b.3 album covers.
coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil3-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil3" }
# WorkManager — D.9d.2 Library rescan worker (debounced foreground watcher).
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
# D.17.2 — SplashScreen 1.x compatibility shim. Required so the
# Theme.SplashScreen parent + windowSplashScreenAnimatedIcon attrs
# resolve, and so installSplashScreen() is callable from MainActivity.
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
# D.20.4 — Palette ktx for album-art-driven theming. Extracts dominant
# swatches (darkMuted, darkVibrant, etc.) from the playing track's
# cover bitmap so `LocalAlbumPalette` can bias the chrome ColorScheme.
androidx-palette-ktx = { module = "androidx.palette:palette-ktx", version.ref = "androidxPalette" }
# Cover-art Phase B test dep — mock HTTP server for Piped client tests.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
# Cover-art Phase D dep — drag-to-reorder Compose LazyColumn helper.
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }